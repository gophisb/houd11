plugins { id "com.android.application" }

android {
    namespace "com.gophisb.houd11"
    compileSdk 35

    defaultConfig {
        applicationId "com.gophisb.houd11"
        minSdk 23
        targetSdk 35
        versionCode 12
        versionName "1.0.1"
    }
}

configurations.configureEach {
    // AndroidX currently pulls legacy Kotlin JDK split artifacts through
    // transitive dependencies; stdlib already contains these classes.
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.13.0"
}
