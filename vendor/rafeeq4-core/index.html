<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <!-- ======================================================
         الرفيق | Al-Rafeeq
         التطبيق الإسلامي المتكامل
    ======================================================= -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   viewport-fit=cover">

    <title>الرفيق | Al-Rafeeq</title>

    <meta name="description"
          content="الرفيق - تطبيق إسلامي متكامل للقرآن الكريم، التفسير، الأذكار، مواقيت الصلاة، القبلة، والأربعين النووية.">

    <meta name="application-name"
          content="الرفيق">

    <meta name="theme-color"
          content="#0B1220">

    <meta name="color-scheme"
          content="dark light">

    <meta name="format-detection"
          content="telephone=no">

    <meta name="mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <meta name="apple-mobile-web-app-title"
          content="الرفيق">


    <!-- ======================================================
         PWA
    ======================================================= -->

    <link rel="manifest"
          href="manifest.json">

    <link rel="icon"
          href="assets/icons/icon.svg"
          type="image/svg+xml">

    <link rel="apple-touch-icon"
          href="assets/icons/icon.svg">


    <!-- ======================================================
         CSS
    ======================================================= -->

    <link rel="stylesheet"
          href="styles.css">


    <!-- ======================================================
         JavaScript
         
         الترتيب مهم:
         
         1. config.js           ← الإعدادات والثوابت
         2. prayer.js           ← محرك مواقيت الصلاة
         3. locations.js        ← بيانات المدن والمواقع
         4. location-manager.js ← إدارة الموقع الجغرافي
         5. router.js           ← نظام التوجيه والصفحات
         6. app.js              ← منسق التطبيق الرئيسي
         
         جميع الملفات تستخدم defer.
         المتصفح يحافظ على ترتيب التنفيذ.
    ======================================================= -->

    <script src="config.js"
            defer></script>

    <script src="prayer.js"
            defer></script>

    <script src="locations.js"
            defer></script>

    <script src="js/location-manager.js"
            defer></script>

    <script src="js/page-modules.js"
            defer></script>

    <script src="router.js"
            defer></script>

    <script src="app.js"
            defer></script>

</head>


<body>

    <!-- ======================================================
         رابط الوصول السريع
    ======================================================= -->

    <a class="skip-link"
       href="#main-content">

        الانتقال إلى المحتوى

    </a>


    <!-- ======================================================
         التطبيق
    ======================================================= -->

    <div id="app">


        <!-- ==================================================
             Header
        =================================================== -->

        <header id="app-header"
                role="banner">
        </header>


        <!-- ==================================================
             Main Content
        =================================================== -->

        <main id="main-content"
              tabindex="-1">
        </main>


        <!-- ==================================================
             Bottom Navigation
        =================================================== -->

        <nav id="bottom-navigation"
             aria-label="التنقل الرئيسي">
        </nav>


        <!-- ==================================================
             Dialog Root
        =================================================== -->

        <div id="dialog-root">
        </div>


        <!-- ==================================================
             Toast Root
        =================================================== -->

        <div id="toast-root"
             aria-live="polite"
             aria-atomic="true">
        </div>


        <!-- ==================================================
             Loader Root
        =================================================== -->

        <div id="loader-root"
             aria-live="polite"
             aria-busy="false">
        </div>


        <!-- ==================================================
             Offline Banner
        =================================================== -->

        <div id="offline-banner"
             role="status"
             aria-live="polite">
        </div>


    </div>


</body>

</html>
