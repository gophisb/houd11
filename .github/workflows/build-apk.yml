name: Build Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11"

      - name: Sync Rafeeq web baseline + Rafeeq 4 core
        run: bash scripts/sync-rafeeq-web.sh

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Locate APK
        run: find app/build/outputs -type f -name "*.apk" -print

      - uses: actions/upload-artifact@v4
        with:
          name: houd11-rafeeq4-release-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
