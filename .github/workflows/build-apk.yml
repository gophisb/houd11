name: Build Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11"

      - name: Sync verified Ar-Rafeeq 4 web source
        run: bash scripts/sync-rafeeq-web.sh

      - name: Apply Houd branding to Android web shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("app/src/main/assets/web")

          # index.html: change only the app-facing browser/PWA labels.
          p = root / "index.html"
          s = p.read_text(encoding="utf-8")
          s = s.replace("<title>الرفيق | Al-Rafeeq</title>", "<title>هود | Houd</title>")
          s = s.replace('content="الرفيق">', 'content="هود">')
          p.write_text(s, encoding="utf-8")

          # manifest.json: parse JSON so branding survives source wording changes.
          p = root / "manifest.json"
          manifest = json.loads(p.read_text(encoding="utf-8"))
          manifest["name"] = "هود"
          manifest["short_name"] = "هود"
          manifest["description"] = "هود - تطبيق إسلامي متكامل للقرآن والذكر والصلاة والقبلة."
          p.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # JS configuration: replace the actual source value, without requiring
          # unrelated comments or wording to match.
          for name in ("config.js", "app.js"):
              p = root / name
              s = p.read_text(encoding="utf-8")
              s = s.replace('APP_NAME: "الرفيق"', 'APP_NAME: "هود"')
              p.write_text(s, encoding="utf-8")

          # Hard verification: the generated Android web shell must actually say Houd.
          checks = {
              "index.html": "هود",
              "manifest.json": '"name": "هود"',
              "config.js": 'APP_NAME: "هود"',
          }
          for name, needle in checks.items():
              s = (root / name).read_text(encoding="utf-8")
              if needle not in s:
                  raise SystemExit(f"Houd branding verification failed: {name}: {needle}")
          PY

      - name: Patch Android offline recitation bridge
        run: python3 scripts/patch-android-recitation.py

      - name: Build lightweight release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify lightweight APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print
          test -n "$(find app/build/outputs -type f -name '*.apk' -print -quit)"
          size=$(stat -c%s "$(find app/build/outputs -type f -name '*.apk' -print -quit)")
          echo "APK_BYTES=$size"
          test "$size" -lt 120000000

      - name: Build optional Quran audio pack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          bash scripts/download-quran-audio.sh

      - uses: actions/upload-artifact@v4
        with:
          name: houd11-rafeeq4-lightweight-release-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: houd11-quran-audio-pack
          path: dist/quran-audio-pack.zip
          if-no-files-found: error
