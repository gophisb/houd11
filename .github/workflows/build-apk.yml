name: Build Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11"

      - name: Sync verified Ar-Rafeeq 4 web source
        run: bash scripts/sync-rafeeq-web.sh

      - name: Apply Houd branding to Android web shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("app/src/main/assets/web")

          # index.html: change only the app-facing browser/PWA labels.
          p = root / "index.html"
          s = p.read_text(encoding="utf-8")
          s = s.replace("<title>الرفيق | Al-Rafeeq</title>", "<title>هود | Houd</title>")
          s = s.replace('content="الرفيق">', 'content="هود">')
          p.write_text(s, encoding="utf-8")

          # manifest.json: parse JSON so branding survives source wording changes.
          p = root / "manifest.json"
          manifest = json.loads(p.read_text(encoding="utf-8"))
          manifest["name"] = "هود"
          manifest["short_name"] = "هود"
          manifest["description"] = "هود - تطبيق إسلامي متكامل للقرآن والذكر والصلاة والقبلة."
          p.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # JS configuration: replace the actual source value, without requiring
          # unrelated comments or wording to match.
          for name in ("config.js", "app.js"):
              p = root / name
              s = p.read_text(encoding="utf-8")
              s = s.replace('APP_NAME: "الرفيق"', 'APP_NAME: "هود"')
              p.write_text(s, encoding="utf-8")

          # Hard verification: the generated Android web shell must actually say Houd.
          checks = {
              "index.html": "هود",
              "manifest.json": '"name": "هود"',
              "config.js": 'APP_NAME: "هود"',
          }
          for name, needle in checks.items():
              s = (root / name).read_text(encoding="utf-8")
              if needle not in s:
                  raise SystemExit(f"Houd branding verification failed: {name}: {needle}")
          PY

      - name: Patch Android offline recitation bridge
        run: python3 scripts/patch-android-recitation.py

      - name: Build lightweight release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign release APK and create final Houd APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$unsigned"

          # This CI key is for a directly installable test/release artifact.
          # A permanent distribution key can later be supplied through secrets
          # without changing the Android project.
          mkdir -p signing dist
          keytool -genkeypair -v             -keystore signing/houd11-ci-release.jks             -storepass houd11-ci             -keypass houd11-ci             -alias houd11             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Houd11, OU=Houd11, O=Houd11, L=Algeria, C=DZ"

          build_tools="$(dirname "$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)")"
          "$build_tools/zipalign" -f 4 "$unsigned" dist/houd11-release-unsigned-aligned.apk
          "$build_tools/apksigner" sign             --ks signing/houd11-ci-release.jks             --ks-key-alias houd11             --ks-pass pass:houd11-ci             --key-pass pass:houd11-ci             --out dist/houd11-release.apk             dist/houd11-release-unsigned-aligned.apk

          "$build_tools/apksigner" verify --verbose --print-certs dist/houd11-release.apk
          rm -f dist/houd11-release-unsigned-aligned.apk
          rm -rf signing

          size=$(stat -c%s dist/houd11-release.apk)
          echo "SIGNED_APK_BYTES=$size"
          test "$size" -lt 120000000

      - name: Verify final APK is signed and installable
        run: |
          set -euo pipefail
          test -f dist/houd11-release.apk
          test ! -f dist/houd11-release-unsigned-aligned.apk
          build_tools="$(dirname "$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)")"
          "$build_tools/apksigner" verify --verbose dist/houd11-release.apk

      - name: Build optional Quran audio pack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          bash scripts/download-quran-audio.sh

      - uses: actions/upload-artifact@v4
        with:
          name: houd11-rafeeq4-lightweight-release-apk
          path: dist/houd11-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: houd11-quran-audio-pack
          path: dist/quran-audio-pack.zip
          if-no-files-found: error
