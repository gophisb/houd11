name: Build Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11"

      - name: Sync verified Ar-Rafeeq 4 web source
        run: bash scripts/sync-rafeeq-web.sh

      - name: Apply Houd branding to Android web shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("app/src/main/assets/web")
          replacements = {
              "index.html": [
                  ("<title>الرفيق | Al-Rafeeq</title>", "<title>هود | Houd</title>"),
                  ('content="الرفيق">', 'content="هود">'),
              ],
              "manifest.json": [
                  ('"name": "الرفيق - رفيقك إلى الطمأنينة"', '"name": "هود"'),
                  ('"short_name": "الرفيق"', '"short_name": "هود"'),
                  ('"description": "تطبيق إسلامي متكامل للقرآن والذكر والصلاة والقبلة."', '"description": "هود - تطبيق إسلامي متكامل للقرآن والذكر والصلاة والقبلة."'),
              ],
              "config.js": [
                  ('APP_NAME: "الرفيق"', 'APP_NAME: "هود"'),
              ],
              "app.js": [
                  ('APP_NAME: "الرفيق"', 'APP_NAME: "هود"'),
              ],
          }
          for name, pairs in replacements.items():
              p = root / name
              if not p.exists():
                  raise SystemExit(f"Missing branding file: {p}")
              s = p.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f"Branding target not found in {p}: {old}")
                  s = s.replace(old, new)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Patch Android offline recitation bridge
        run: python3 scripts/patch-android-recitation.py

      - name: Build lightweight release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify lightweight APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print
          test -n "$(find app/build/outputs -type f -name '*.apk' -print -quit)"
          size=$(stat -c%s "$(find app/build/outputs -type f -name '*.apk' -print -quit)")
          echo "APK_BYTES=$size"
          test "$size" -lt 120000000

      - name: Build optional Quran audio pack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          bash scripts/download-quran-audio.sh

      - uses: actions/upload-artifact@v4
        with:
          name: houd11-rafeeq4-lightweight-release-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: houd11-quran-audio-pack
          path: dist/quran-audio-pack.zip
          if-no-files-found: error
