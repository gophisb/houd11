name: Build Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11"

      - name: Sync verified Ar-Rafeeq 4 web source
        run: bash scripts/sync-rafeeq-web.sh

      - name: Download bundled Minshawy Quran audio
        run: bash scripts/download-quran-audio.sh

      - name: Verify offline Quran payload
        run: |
          test "$(find app/src/main/assets/web/assets/audio/minshawy -type f -name '*.mp3' | wc -l)" -eq 6236
          test "$(find app/src/main/assets/web/assets/audio/minshawy -type f -name '*.mp3' -size 0 | wc -l)" -eq 0
          du -sh app/src/main/assets/web/assets/audio/minshawy

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK exists
        run: |
          find app/build/outputs -type f -name "*.apk" -print
          test -n "$(find app/build/outputs -type f -name '*.apk' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: houd11-rafeeq4-offline-release-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
